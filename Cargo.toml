[package]
name = "crt"
version = "0.1.0"
edition = "2024"
description = "Code Review Tool — terminal-based code review with LLM agent support"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"

# Git
git2 = "0.20"

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Hashing
sha2 = "0.10"

# Error handling
anyhow = "1"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Search (ripgrep internals)
ignore = "0.4"
regex = "1"

# Serialization (JSON-RPC, server messages)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Configuration
toml = "0.8"

# Async runtime (server)
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rmcp = { version = "1.8.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Platform (signal handling for Ctrl-Z suspend)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
git2 = "0.20"

[dev-dependencies]
tempfile = "3"
