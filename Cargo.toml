[package]
name = "crt"
version = "0.1.0"
edition = "2024"
description = "Code Review Tool — terminal-based code review with LLM agent support"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Git
git2 = "0.20"

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Hashing
sha2 = "0.10"

# Error handling
anyhow = "1"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Search (ripgrep internals)
ignore = "0.4"
regex = "1"

# Serialization (JSON-RPC, server messages)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime (server)
tokio = { version = "1", features = ["full"] }

[build-dependencies]
git2 = "0.20"

[dev-dependencies]
tempfile = "3"
